name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Git describe
      id: ghd
      uses: proudust/gh-describe@v2.1.0
      with:
        exclude: v*-*

    - name: Build release (signed with auto-generated debug keystore)
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease -P versionName=${{ steps.ghd.outputs.describe }}

    - name: Collect artifact name
      run: |
        for variant in vc105 normal; do
          artifact_name=$(basename -s .apk push/build/outputs/apk/$variant/release/*.apk)
          echo "${variant}_release_artifact=$artifact_name" >> $GITHUB_ENV
        done

    - name: Upload Release For Normal
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.normal_release_artifact }}
        path: push/build/outputs/apk/normal/release/*.apk

    - name: Upload Release For VC105
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.vc105_release_artifact }}
        path: push/build/outputs/apk/vc105/release/*.apk

    - name: Get Version Name
      id: gvn
      run: |
        artifact_name=(push/build/outputs/apk/*/release/*.apk)
        version=$(echo $artifact_name | sed 's/.*(v.*)(-[^-]+){2}/\1/' -r)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.gvn.outputs.version }}
        tag_name: ${{ steps.gvn.outputs.version }}
        target_commitish: ${{ steps.ghd.outputs.sha }}
        prerelease: true
        files: push/build/outputs/apk/*/release/*.apk
